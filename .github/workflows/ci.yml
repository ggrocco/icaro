name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -s -l $(git ls-files '*.go'))" || (gofmt -s -l $(git ls-files '*.go'); exit 1)
      - run: go vet ./...
      # golangci-lint is built from source and needs a toolchain at least as
      # new as the one it was released with, so build it with current stable
      # Go and pin the version (05-engineering: pinned dependencies).
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          install-mode: goinstall

  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go generate ./... && git diff --exit-code
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      # The latency target (ADR 0020) is skipped under -race; check it here.
      - name: memory search latency (10k documents)
        if: matrix.os == 'ubuntu-latest'
        run: go test -count=1 -run QueryLatency10k ./internal/memory
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage.out

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run typecheck && npm test && npm run build

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o /dev/null ./cmd/icaro

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: icaro
          POSTGRES_PASSWORD: icaro
          POSTGRES_DB: icaro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U icaro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ICARO_TEST_POSTGRES_DSN: postgres://icaro:icaro@localhost:5432/icaro?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: docker version
      - run: make test-integration
