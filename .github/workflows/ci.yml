name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs the whole workflow on the tagged commit before it
  # builds anything.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -s -l)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - run: go vet ./...
      # Workflows, release.yml included (it only runs on tags), checked with
      # shellcheck for their run scripts.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      # The desktop app reaches the daemon over its HTTP API only (ADR
      # 0027), so its logic must not link the daemon's packages and their
      # dependencies (database drivers, the Docker client).
      - name: the desktop app links no daemon internals
        run: |
          extra=$(go list -deps -f '{{with .Module}}{{.Path}}{{end}}' ./internal/desktop | sort -u | grep -vxE 'icaro|go.yaml.in/yaml/v3' || true)
          test -z "$extra" || { echo "internal/desktop links: $extra"; exit 1; }
      # golangci-lint is built from source and needs a toolchain at least as
      # new as the one it was released with, so build it with current stable
      # Go and pin the version (05-engineering: pinned dependencies).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall

  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go generate ./... && git diff --exit-code
      - name: CLI reference is up to date
        run: go run ./hack/gendocs -check
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      # The latency target (ADR 0020) is skipped under -race; check it here.
      - name: memory search latency (10k documents)
        if: matrix.os == 'ubuntu-latest'
        run: go test -count=1 -run QueryLatency10k ./internal/memory
      # Phase 11 load budget at full size: 500 runs x 5 steps, 200 SSE streams.
      - name: load tests
        if: matrix.os == 'ubuntu-latest'
        run: go test -count=1 -tags load -run Load ./internal/workflow/engine ./internal/api
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1
      # Per-package target and justified exceptions (ADR 0025). Linux only:
      # platform files make the macOS numbers differ.
      - name: coverage gate
        if: matrix.os == 'ubuntu-latest'
        run: go run ./hack/covercheck -profile coverage.out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: coverage
          path: coverage.out

  fuzz:
    # Short fuzzing runs of the parsers that take untrusted input
    # (05-engineering: fuzz parsers and schema). The seed corpora also run
    # as plain tests in the unit job; this explores beyond them.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { pkg: ./internal/expr, fuzz: FuzzParse }
          - { pkg: ./internal/workflow, fuzz: FuzzParse }
          - { pkg: ./internal/integration, fuzz: FuzzParse }
          - { pkg: ./internal/preview, fuzz: FuzzParseCompose }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: fuzz ${{ matrix.target.pkg }} ${{ matrix.target.fuzz }}
        run: go test -run '^$' -fuzz '^${{ matrix.target.fuzz }}$' -fuzztime 20s ${{ matrix.target.pkg }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashers-${{ strategy.job-index }}
          path: internal/**/testdata/fuzz

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run typecheck && npm test && npm run build
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: npm production dependency licenses
        run: go run ./hack/licenses -npm web -out web/THIRD_PARTY_LICENSES.md -check

  audit:
    # Dependency/license audit (Phase 11): every module linked into the
    # binary has an allowed license and THIRD_PARTY_LICENSES.md is current;
    # govulncheck reports known vulnerabilities in reachable code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Go module licenses
        run: go run ./hack/licenses -check
      # Vulnerabilities are checked against the current patch release, the
      # toolchain releases should be built with.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  e2e:
    # Critical flows only (05-engineering): create, run and cancel a
    # workflow from the UI against a real daemon and Docker engine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web build
      - name: quickstart (docs/quickstart.md against a real daemon and Docker)
        run: go test -count=1 -tags e2e ./hack/quickstart
      - run: cd web && npx playwright install --with-deps chromium
      - run: cd web && npx playwright test
      - name: session spine (worktree -> container -> preview -> memory)
        run: go test -count=1 -tags e2e ./hack/e2e/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o /dev/null ./cmd/icaro

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: icaro
          POSTGRES_PASSWORD: icaro
          POSTGRES_DB: icaro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U icaro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ICARO_TEST_POSTGRES_DSN: postgres://icaro:icaro@localhost:5432/icaro?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: docker version
      - run: make test-integration COVERFLAGS="-coverpkg=./internal/container/docker -coverprofile=integration.out"
      # The Docker adapter has no unit tests by design (ADR 0025).
      - name: coverage gate (Docker adapter)
        run: go run ./hack/covercheck -profile integration.out -prefix icaro/internal/container/docker -default 75 -thresholds /dev/null

  desktop:
    # The desktop app (ADR 0027) is its own module and needs cgo, so it is
    # built and tested on both platforms here rather than in unit/lint.
    # The macOS job also assembles Icaro.app (signed ad hoc) and runs it.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - name: GTK 4 and WebKitGTK 6 headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: go.mod is tidy and the icons match gen.go
        run: cd desktop && go mod tidy -diff && go generate ./icons && git diff --exit-code
      - run: make app-test
      - run: make app && bin/icaro-app --version
      - name: Icaro.app
        if: runner.os == 'macOS'
        run: |
          make app-macos
          bin/Icaro.app/Contents/MacOS/icaro version
          bin/Icaro.app/Contents/MacOS/icaro-app --version
      - name: Go module licenses (the macOS app)
        if: runner.os == 'Linux'
        run: go run ./hack/licenses -dir desktop -goos darwin -pkg . -out THIRD_PARTY_LICENSES.md -check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: runner.os == 'Linux'
        with:
          go-version: stable
      - name: govulncheck
        if: runner.os == 'Linux'
        run: cd desktop && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: runner.os == 'Linux'
        with:
          version: v2.15.0
          install-mode: goinstall
          working-directory: desktop

  agent-image:
    # Releases build the agent base image; building it here (amd64, not
    # pushed) catches base image, Node and asdf breakage before a tag does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make image-agent AGENT_IMAGE=icaro-agent:ci
      - name: smoke test
        run: docker run --rm icaro-agent:ci bash -c 'asdf version && node --version && npm ls -g --depth=0 && claude --version && codex --version && icaro version'
