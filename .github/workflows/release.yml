name: release

# Builds, signs and publishes a release for every v* tag (ADR 0021).
# Secrets: ICARO_SIGNING_KEY (base64 ed25519 seed), HOMEBREW_TAP_TOKEN.
# Variables: ICARO_RELEASE_PUBKEY (base64 ed25519 public key).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write     # create the release
  packages: write     # push the agent base image to GHCR
  id-token: write     # cosign keyless signing + provenance
  attestations: write # build provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          ICARO_SIGNING_KEY: ${{ secrets.ICARO_SIGNING_KEY }}
          ICARO_RELEASE_PUBKEY: ${{ vars.ICARO_RELEASE_PUBKEY }}
      - name: verify the published signature offline
        run: |
          printf '%s' "${{ vars.ICARO_RELEASE_PUBKEY }}" > pub.b64
          go run ./hack/sign verify -pub pub.b64 -in dist/checksums.txt -sig dist/checksums.txt.sig
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt

  agent-image:
    # The agent base image (architecture §5) referenced by the default
    # profiles. Override the name with the AGENT_IMAGE repository variable;
    # the default matches config.DefaultAgentImage.
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.AGENT_IMAGE || 'ghcr.io/icaro-dev/agent-base' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: static icaro for each image architecture
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -ldflags "-s -w -X icaro/internal/cli.version=${GITHUB_REF_NAME}" -o bin/icaro-linux-$arch ./cmd/icaro
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/agent-base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
      - uses: sigstore/cosign-installer@v3
      - name: sign the image by digest (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
