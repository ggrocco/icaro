name: release

# Builds, signs and publishes a release for every v* tag (ADR 0021).
# Cut one with `make release TAG=vX.Y.Z` (hack/release.sh); a tag with a
# pre-release suffix (v1.2.3-rc.1) is published as a GitHub pre-release.
# Secrets: ICARO_SIGNING_KEY (base64 ed25519 seed), and optionally
# HOMEBREW_TAP_TOKEN (without it the cask is not pushed to the tap).
# Variables: ICARO_RELEASE_PUBKEY (base64 ed25519 public key).
# The desktop app (ADR 0027) is attached for macOS (a universal Icaro.app)
# and for Linux (a tarball per architecture). The macOS app is signed and
# notarized when these secrets are set, and signed ad hoc otherwise:
# MACOS_CERTIFICATE (base64 .p12 of a
# "Developer ID Application" identity), MACOS_CERTIFICATE_PASSWORD,
# APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (an app-specific password).
#
# Gates (CONTRIBUTING.md#releases): the tag must point at a commit on main,
# the full CI workflow must pass on it, and every job that publishes runs
# in the `release` environment, whose required reviewers approve it and
# which alone holds the secrets above.
on:
  push:
    tags: ["v*"]

# Every job holds the signing key or a publishing token, so third-party
# actions are pinned to commit SHAs (Dependabot bumps them) and each job
# gets only the permissions it needs.
permissions: {}

jobs:
  tag-on-main:
    # A v* tag on a branch, a fork's commit or an unmerged PR is refused.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: the tagged commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; tag a merged commit"
            exit 1
          fi

  ci:
    # The same gates as every merge: lint, race tests on Linux and macOS,
    # the coverage gate, fuzzing, integration, e2e, the desktop app and
    # the agent image build.
    needs: tag-on-main
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: [tag-on-main, ci]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write     # create the release
      id-token: write     # cosign keyless signing + provenance
      attestations: write # build provenance
    steps:
      # Nothing is built or published without the signing key: install.sh
      # and `icaro update` refuse a release whose checksums are unsigned.
      - name: the signing key is configured
        env:
          HAS_KEY: ${{ secrets.ICARO_SIGNING_KEY != '' }}
          HAS_PUBKEY: ${{ vars.ICARO_RELEASE_PUBKEY != '' }}
          HAS_TAP: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          missing=0
          if [ "$HAS_KEY" != true ]; then
            echo "::error::secret ICARO_SIGNING_KEY is not set in the 'release' environment"
            missing=1
          fi
          if [ "$HAS_PUBKEY" != true ]; then
            echo "::error::variable ICARO_RELEASE_PUBKEY is not set"
            missing=1
          fi
          if [ "$missing" = 1 ]; then
            echo "::error::generate both with 'go run ./hack/sign keygen' (CONTRIBUTING.md#one-time-setup)"
            exit 1
          fi
          if [ "$HAS_TAP" != true ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew cask is built but not pushed to ggrocco/homebrew-tap"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The binary embeds the web UI; without a build it serves a
      # "not built" page (web/dist is gitignored, so the tree stays clean).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web
      # Exact tool versions: they run with the signing key in the env.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.42.3
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.5.2
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          ICARO_SIGNING_KEY: ${{ secrets.ICARO_SIGNING_KEY }}
          ICARO_RELEASE_PUBKEY: ${{ vars.ICARO_RELEASE_PUBKEY }}
      - name: verify the published signature offline
        run: |
          printf '%s' "${{ vars.ICARO_RELEASE_PUBKEY }}" > pub.b64
          go run ./hack/sign verify -pub pub.b64 -in dist/checksums.txt -sig dist/checksums.txt.sig
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt

  macos-app:
    # Icaro.app, attached to the release as a zip and as a disk image, each
    # with a SHA-256 file and an ed25519 signature (go run ./hack/sign verify).
    needs: release
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write     # upload to the release
      id-token: write     # provenance
      attestations: write # provenance
    env:
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web
      - name: import the Developer ID identity
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw=$(uuidgen)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
          # Add ours in front of the user's keychains, one argument each.
          # (a read loop: macOS ships bash 3.2, which has no mapfile).
          keychains=()
          while IFS= read -r line; do
            line=${line#*\"}
            keychains+=("${line%\"}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$kc" "${keychains[@]}"
          id=$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          test -n "$id" || { echo "no Developer ID Application identity in MACOS_CERTIFICATE" >&2; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$id" >> "$GITHUB_ENV"
      - name: build Icaro.app
        env:
          ICARO_RELEASE_PUBKEY: ${{ vars.ICARO_RELEASE_PUBKEY }}
        run: desktop/build/bundle.sh dist "$GITHUB_REF_NAME"
      - name: notarize
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent dist/Icaro.app dist/notarize.zip
          xcrun notarytool submit dist/notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Icaro.app
          spctl --assess --type execute --verbose dist/Icaro.app
          rm dist/notarize.zip
      # After the app is stapled, so the copy in the image has its ticket.
      - name: disk image
        run: echo "DMG=$(desktop/build/dmg.sh dist "$GITHUB_REF_NAME")" >> "$GITHUB_ENV"
      - name: notarize the disk image
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"
      - name: unsigned build
        if: env.HAS_CERT != 'true' || env.HAS_NOTARY != 'true'
        run: echo "::warning::Icaro.app is not notarized; set the MACOS_* and APPLE_* secrets (see the top of release.yml)"
      - name: attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ICARO_SIGNING_KEY: ${{ secrets.ICARO_SIGNING_KEY }}
        run: |
          zip="dist/Icaro_${GITHUB_REF_NAME#v}_macos_universal.zip"
          ditto -c -k --keepParent dist/Icaro.app "$zip"
          for f in "$zip" "$DMG"; do
            (cd dist && shasum -a 256 "$(basename "$f")" > "$(basename "$f").sha256")
            go run ./hack/sign sign -in "$f" -out "$f.sig"
            gh release upload "$GITHUB_REF_NAME" "$f" "$f.sha256" "$f.sig" --clobber
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.dmg

  linux-app:
    # The desktop app for Linux (ADR 0027), attached to the release as one
    # tarball per architecture with a SHA-256 file and an ed25519 signature
    # (go run ./hack/sign verify). It needs cgo and the system's GTK, so
    # each architecture builds on its own runner. The runner image is
    # pinned: the app runs on distributions at least as new as it.
    needs: release
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: write     # upload to the release
      id-token: write     # provenance
      attestations: write # provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The bundled CLI embeds the web UI, as the released binaries do.
      - run: make web
      - name: GTK 4 and WebKitGTK 6 headers
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - name: build the tarball
        env:
          ICARO_RELEASE_PUBKEY: ${{ vars.ICARO_RELEASE_PUBKEY }}
        run: |
          tarball=$(desktop/build/package-linux.sh dist "$GITHUB_REF_NAME")
          test "$(basename "$tarball")" = "Icaro_${GITHUB_REF_NAME#v}_linux_${{ matrix.arch }}.tar.gz"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
      - name: attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ICARO_SIGNING_KEY: ${{ secrets.ICARO_SIGNING_KEY }}
        run: |
          (cd dist && sha256sum "$(basename "$TARBALL")" > "$(basename "$TARBALL").sha256")
          go run ./hack/sign sign -in "$TARBALL" -out "$TARBALL.sig"
          gh release upload "$GITHUB_REF_NAME" "$TARBALL" "$TARBALL.sha256" "$TARBALL.sig" --clobber
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

  agent-image:
    # The agent base image (architecture §5) referenced by the default
    # profiles. Override the name with the AGENT_IMAGE repository variable;
    # the default matches config.DefaultAgentImage.
    needs: [tag-on-main, ci]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write # push the agent base image to GHCR
      id-token: write # cosign keyless signing
    env:
      IMAGE: ${{ vars.AGENT_IMAGE || 'ghcr.io/ggrocco/icaro-agent-base' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: static icaro for each image architecture
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -ldflags "-s -w -X icaro/internal/cli.version=${GITHUB_REF_NAME}" -o bin/icaro-linux-$arch ./cmd/icaro
          done
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/agent-base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          # Links the GHCR package to this repository, which is what lets
          # the workflow's GITHUB_TOKEN create it and push later versions.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.5.2
      - name: sign the image by digest (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
