name: docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: relative links in Markdown and site/ (offline)
        run: go run ./hack/linkcheck .
      - name: install.sh is valid POSIX sh
        run: sh -n install.sh
