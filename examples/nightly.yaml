# A scheduled workflow. Cron triggers fire from the daemon's scheduler; a
# fire missed while the daemon was down runs once on restart.
version: 1
name: nightly-cleanup
concurrency: forbid
triggers:
  - type: cron
    cron: "15 3 * * *"
  - type: manual
steps:
  - id: sweep
    image: alpine:3.24@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    command: echo "sweeping run ${{ run.id }} of ${{ workflow.name }}"
